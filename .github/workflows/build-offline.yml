name: Build Offline Editor

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'offline/monaco.js'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: editor2-offline-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            codemirror/package-lock.json
            monaco/package-lock.json

      - name: Install CodeMirror build dependencies
        run: npm ci --prefix codemirror

      - name: Install Monaco dependencies
        run: npm ci --prefix monaco

      - name: Build the single-file offline editor
        run: node tools/build-offline.mjs

      - name: Commit the generated standalone Monaco bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add offline/monaco.js
          if ! git diff --cached --quiet; then
            git commit -m "Build standalone offline Monaco bundle"
            git push
          fi

      - name: Install Playwright for offline runtime testing
        run: npm install --prefix /tmp/editor2-playwright playwright

      - name: Install Chromium
        run: npx --yes --package=playwright playwright install --with-deps chromium

      - name: Test the offline editor in a browser
        run: node tools/test-offline.mjs

      - name: Keep a downloadable build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Editor2-Offline
          path: dist/offline.html
          if-no-files-found: error
          retention-days: 90

      - name: Publish or update the latest offline release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          if ! gh release view offline-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create offline-latest dist/offline.html \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Editor2 Offline Build" \
              --notes "Automatically generated from the latest successful build on main." \
              --prerelease
          else
            gh release upload offline-latest dist/offline.html \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          fi
