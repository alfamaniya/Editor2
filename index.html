<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editor2</title>
  <link rel="stylesheet" href="./core/editor/editor.css">
  <link rel="stylesheet" href="./core/live/live.css">
  <link rel="stylesheet" href="./core/panels/panels.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header>
    <div class="header-group header-left">
      <button class="panel-toggle" type="button" data-open-panel="left" aria-label="Open left menu" title="Open left menu" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="brand">Editor2</div>
    </div>
    <nav id="engine-switch" aria-label="Editor engine">
      <button class="engine-button active" data-engine="monaco" type="button">Monaco</button>
      <button class="engine-button" data-engine="codemirror" type="button">CodeMirror</button>
      <button class="engine-button" data-engine="alfamaniya" type="button">آلفامانیا</button>
    </nav>
    <div class="header-group header-right">
      <div id="save-status">Loading...</div>
      <button class="panel-toggle" type="button" data-open-panel="right" aria-label="Open right menu" title="Open right menu" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="1.5"/><path d="M15 5v14"/></svg>
      </button>
    </div>
  </header>

  <div id="panels-component"></div>

  <main id="main">
    <div id="editor-component"></div>
    <div id="live-component"></div>
  </main>

  <script src="./vendor/monaco/vs/loader.js"></script>
  <script src="./core/editor/alfamaniya.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
