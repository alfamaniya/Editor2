<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editor2</title>
  <link rel="stylesheet" href="./core/editor/editor.css">
  <link rel="stylesheet" href="./core/live/live.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header>
    <div class="brand">Editor2</div>
    <nav id="engine-switch" aria-label="Editor engine">
      <button class="engine-button active" data-engine="monaco" type="button">Monaco</button>
      <button class="engine-button" data-engine="codemirror" type="button">CodeMirror</button>
    </nav>
    <div id="save-status">Loading...</div>
  </header>

  <main id="main">
    <div id="editor-component"></div>
    <div id="live-component"></div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/loader.min.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
